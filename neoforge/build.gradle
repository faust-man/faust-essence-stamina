plugins { id 'java-library'; id 'net.neoforged.moddev' }
base.archivesName = 'fauststamina-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir '../src/main/java'
sourceSets.main.resources { srcDir '../src/main/resources'; exclude 'fabric.mod.json' }
neoForge {
    version = '21.1.80'
    parchment { minecraftVersion='1.21'; mappingsVersion='2024.11.10' }
    mods { fauststamina { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly files(new File(rootProject.coreProjectDir, 'neoforge/build/libs/faustcore-neoforge-1.21.1-1.6.0.jar'))
}
processResources { filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) } }
jar { from(rootProject.file('LICENSE')) }

sourceSets.main.java.exclude '**/StaminaModMenu.java'
